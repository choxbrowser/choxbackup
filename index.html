<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chox Browser</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

body {
    display: flex;
}

.browser {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #171717;
}

/* =========================
   TABS
========================= */

.tab-bar {
    height: 46px;
    background: #202020;
    display: flex;
    align-items: flex-end;
    padding: 6px 8px 0;
    gap: 5px;
    border-bottom: 1px solid #333;
}

.tabs {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    min-width: 0;
    overflow-x: auto;
    height: 100%;
}

.tab {
    height: 38px;
    min-width: 150px;
    max-width: 230px;
    padding: 0 8px 0 14px;
    background: #2b2b2b;
    border-radius: 10px 10px 0 0;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: #aaa;
    border: 1px solid #333;
    border-bottom: none;
}

.tab.active {
    background: #303030;
    color: white;
}

.tab-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
}

.tab-close {
    width: 25px;
    height: 25px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #aaa;
    font-size: 17px;
    cursor: pointer;
}

.tab-close:hover {
    background: #444;
    color: white;
}

.new-tab {
    width: 38px;
    height: 36px;
    border: none;
    background: transparent;
    color: white;
    font-size: 25px;
    cursor: pointer;
    border-radius: 8px;
}

.new-tab:hover {
    background: #333;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    height: 58px;
    background: #242424;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border-bottom: 1px solid #333;
}

.toolbar-button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #ddd;
    font-size: 19px;
    cursor: pointer;
    flex-shrink: 0;
}

.toolbar-button:hover {
    background: #383838;
    color: white;
}

.address-container {
    flex: 1;
    height: 40px;
    background: #181818;
    border: 1px solid #3b3b3b;
    border-radius: 22px;
    display: flex;
    align-items: center;
    padding: 0 15px;
}

.address-bar {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 14px;
}

/* =========================
   CONTENT
========================= */

.content {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #111;
}

.tab-page {
    position: absolute;
    inset: 0;
    display: none;
}

.tab-page.active {
    display: block;
}

/* =========================
   HOME
========================= */

.home-page {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 50px 20px;
    background:
        radial-gradient(circle at top, #303030 0%, #171717 35%, #101010 100%);
}

.home-inner {
    width: min(900px, 100%);
    margin: auto;
    text-align: center;
}

.logo {
    font-size: 70px;
    font-weight: 800;
    letter-spacing: -5px;
}

.logo span {
    color: #e53935;
}

.subtitle {
    color: #999;
    margin-bottom: 35px;
}

.search-form {
    width: min(720px, 100%);
    height: 58px;
    margin: auto;
    display: flex;
    background: #222;
    border: 1px solid #444;
    border-radius: 30px;
    overflow: hidden;
}

.search-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 0 22px;
    font-size: 16px;
}

.search-button {
    width: 120px;
    border: none;
    background: #e53935;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.quick-title {
    margin-top: 55px;
    margin-bottom: 18px;
    color: #aaa;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.quick-links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
}

.quick-link {
    padding: 18px 10px;
    border-radius: 14px;
    background: #222;
    border: 1px solid #363636;
    color: white;
    text-decoration: none;
    cursor: pointer;
    transition: .2s;
}

.quick-link:hover {
    transform: translateY(-2px);
    background: #2b2b2b;
}

.quick-icon {
    display: block;
    font-size: 25px;
    margin-bottom: 8px;
}

/* =========================
   CHOX VIDEO
========================= */

.chox-video-page {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    background: #101010;
    color: white;
}

.cv-layout {
    min-height: 100%;
    display: flex;
}

.cv-sidebar {
    width: 220px;
    flex-shrink: 0;
    background: #191919;
    border-right: 1px solid #333;
    padding: 20px 12px;
}

.cv-brand {
    font-size: 24px;
    font-weight: 800;
    padding: 10px 12px 25px;
}

.cv-brand span {
    color: #e53935;
}

.cv-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.cv-nav button {
    border: none;
    background: transparent;
    color: #ccc;
    text-align: left;
    padding: 13px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
}

.cv-nav button:hover,
.cv-nav button.active {
    background: #303030;
    color: white;
}

.cv-main {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
}

.cv-header {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
}

.cv-search {
    flex: 1;
    height: 46px;
    background: #202020;
    border: 1px solid #3b3b3b;
    border-radius: 23px;
    padding: 0 18px;
    color: white;
    outline: none;
}

.cv-search-button {
    width: 90px;
    border: none;
    border-radius: 23px;
    background: #e53935;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.cv-search-button:hover {
    background: #f04440;
}

.cv-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
}

.cv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
}

.cv-card {
    background: #1b1b1b;
    border: 1px solid #2f2f2f;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.cv-card:hover {
    transform: translateY(-3px);
    border-color: #555;
}

.cv-thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #252525;
    display: block;
}

.cv-card-body {
    padding: 13px;
}

.cv-card-title {
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 7px;
}

.cv-card-url {
    color: #888;
    font-size: 12px;
}

.cv-empty {
    padding: 60px 20px;
    text-align: center;
    color: #888;
}

.cv-player {
    max-width: 1000px;
    margin: auto;
}

.cv-player iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 12px;
    background: black;
}

.cv-player-title {
    font-size: 20px;
    font-weight: bold;
    margin: 15px 0;
}

.cv-player-buttons {
    display: flex;
    gap: 10px;
}

.cv-action {
    border: none;
    padding: 10px 15px;
    border-radius: 9px;
    background: #292929;
    color: white;
    cursor: pointer;
}

.cv-action:hover {
    background: #3a3a3a;
}

@media (max-width: 700px) {

    .cv-sidebar {
        width: 65px;
        padding: 10px 6px;
    }

    .cv-brand {
        font-size: 0;
        text-align: center;
    }

    .cv-brand::after {
        content: "C";
        font-size: 24px;
        color: #e53935;
    }

    .cv-nav button {
        text-align: center;
        font-size: 0;
    }

    .cv-nav button::first-letter {
        font-size: 18px;
    }

    .cv-main {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="browser">

    <!-- TABS -->

    <div class="tab-bar">

        <div class="tabs" id="tabs"></div>

        <button
            class="new-tab"
            onclick="createNewTab()"
            title="New Tab">
            +
        </button>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <button
            class="toolbar-button"
            onclick="goBack()"
            title="Back">
            ←
        </button>

        <button
            class="toolbar-button"
            onclick="goForward()"
            title="Forward">
            →
        </button>

        <button
            class="toolbar-button"
            onclick="reloadPage()"
            title="Reload">
            ↻
        </button>

        <button
            class="toolbar-button"
            onclick="goHome()"
            title="Home">
            ⌂
        </button>

        <div class="address-container">

            <input
                id="addressBar"
                class="address-bar"
                type="text"
                placeholder="Search or enter website address"
                autocomplete="off"
                onkeydown="addressKey(event)"
            >

        </div>

    </div>


    <!-- CONTENT -->

    <div
        class="content"
        id="content">
    </div>

</div>


<script>

/* =========================================================
   CHOX BROWSER
========================================================= */

let tabs = [];
let activeTabId = null;
let tabCounter = 0;


/* =========================================================
   CREATE TAB
========================================================= */

function createNewTab() {

    tabCounter++;

    const id =
        "tab-" + tabCounter;

    const tab = {

        id: id,

        title: "New Tab",

        url: "",

        type: "home",

        history: [],

        historyIndex: -1

    };

    tabs.push(tab);

    createTabButton(tab);

    createTabPage(tab);

    switchTab(id);
}


/* =========================================================
   TAB BUTTON
========================================================= */

function createTabButton(tab) {

    const container =
        document.getElementById("tabs");

    const button =
        document.createElement("div");

    button.className = "tab";

    button.dataset.id = tab.id;

    button.innerHTML = `
        <span class="tab-title">
            ${escapeHTML(tab.title)}
        </span>

        <button
            class="tab-close"
            title="Close Tab">
            ×
        </button>
    `;

    button.addEventListener(
        "click",
        function() {

            switchTab(tab.id);

        }
    );

    button
        .querySelector(".tab-close")
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                closeTab(tab.id);

            }
        );

    container.appendChild(button);
}


/* =========================================================
   CREATE PAGE
========================================================= */

function createTabPage(tab) {

    const content =
        document.getElementById("content");

    const page =
        document.createElement("div");

    page.className = "tab-page";

    page.id =
        "page-" + tab.id;

    content.appendChild(page);

    renderHome(tab);
}


/* =========================================================
   HOME
========================================================= */

function renderHome(tab) {

    const page =
        document.getElementById(
            "page-" + tab.id
        );

    if (!page) return;

    page.innerHTML = `

        <div class="home-page">

            <div class="home-inner">

                <div class="logo">
                    Ch<span>o</span>x
                </div>

                <div class="subtitle">
                    A simple, fast web experience
                </div>

                <form
                    class="search-form"
                    id="search-${tab.id}"
                >

                    <input
                        class="search-input"
                        id="home-search-${tab.id}"
                        type="text"
                        placeholder="Search the web..."
                        autocomplete="off"
                    >

                    <button
                        class="search-button"
                        type="submit">
                        Search
                    </button>

                </form>

                <div class="quick-title">
                    Quick Links
                </div>

                <div class="quick-links">

                    <button
                        class="quick-link"
                        onclick="openChoxVideoPage('${tab.id}')">

                        <span class="quick-icon">
                            ▶
                        </span>

                        <span>
                            Chox Video
                        </span>

                    </button>

                    <a
                        class="quick-link"
                        href="https://www.youtube.com/"
                        target="_blank">

                        <span class="quick-icon">
                            ▶
                        </span>

                        <span>
                            YouTube
                        </span>

                    </a>

                    <a
                        class="quick-link"
                        href="https://www.google.com/"
                        target="_blank">

                        <span class="quick-icon">
                            G
                        </span>

                        <span>
                            Google
                        </span>

                    </a>

                    <a
                        class="quick-link"
                        href="https://github.com/"
                        target="_blank">

                        <span class="quick-icon">
                            ◉
                        </span>

                        <span>
                            GitHub
                        </span>

                    </a>

                    <a
                        class="quick-link"
                        href="https://www.reddit.com/"
                        target="_blank">

                        <span class="quick-icon">
                            ●
                        </span>

                        <span>
                            Reddit
                        </span>

                    </a>

                </div>

            </div>

        </div>
    `;


    document
        .getElementById(
            "search-" + tab.id
        )
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const input =
                    document.getElementById(
                        "home-search-" + tab.id
                    );

                const query =
                    input.value.trim();

                if (!query) return;

                performSearch(
                    tab.id,
                    query
                );

            }
        );
}


/* =========================================================
   CHOX VIDEO
========================================================= */

function openChoxVideoPage(tabId) {

    const tab =
        tabs.find(
            t => t.id === tabId
        );

    if (!tab) return;

    tab.type = "chox-video";

    tab.url = "chox://video";

    tab.title = "Chox Video";

    const page =
        document.getElementById(
            "page-" + tab.id
        );

    if (!page) return;

    page.innerHTML = `

        <div class="chox-video-page">

            <div class="cv-layout">

                <aside class="cv-sidebar">

                    <div class="cv-brand">
                        Chox<span> Video</span>
                    </div>

                    <nav class="cv-nav">

                        <button
                            class="active"
                            onclick="cvShowHome('${tab.id}')">
                            🏠 Home
                        </button>

                        <button
                            onclick="cvSearchVideos('${tab.id}')">
                            🔍 Search
                        </button>

                        <button
                            onclick="cvShowHistory('${tab.id}')">
                            🕘 History
                        </button>

                        <button
                            onclick="cvShowFavorites('${tab.id}')">
                            ⭐ Favorites
                        </button>

                    </nav>

                </aside>


                <main class="cv-main">

                    <div class="cv-header">

                        <input
                            id="cv-search-${tab.id}"
                            class="cv-search"
                            type="text"
                            placeholder="Search videos..."
                            autocomplete="off"
                        >

                        <button
                            class="cv-search-button"
                            onclick="cvSearchVideos('${tab.id}')">
                            Search
                        </button>

                    </div>

                    <div id="cv-content-${tab.id}">

                        <div class="cv-title">
                            Chox Video
                        </div>

                        <div class="cv-empty">
                            Search for videos to get started.
                        </div>

                    </div>

                </main>

            </div>

        </div>
    `;

    updateTabButton(tab);

    updateAddressBar();

    const input =
        document.getElementById(
            "cv-search-" + tab.id
        );

    if (input) {

        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    cvSearchVideos(tab.id);

                }

            }
        );

    }
}


/* =========================================================
   CHOX VIDEO HOME
========================================================= */

function cvShowHome(tabId) {

    const container =
        document.getElementById(
            "cv-content-" + tabId
        );

    if (!container) return;

    container.innerHTML = `

        <div class="cv-title">
            Chox Video
        </div>

        <div class="cv-empty">
            Search for videos to get started.
        </div>
    `;
}


/* =========================================================
   CHOX VIDEO SEARCH
========================================================= */

async function cvSearchVideos(tabId) {

    const input =
        document.getElementById(
            "cv-search-" + tabId
        );

    const container =
        document.getElementById(
            "cv-content-" + tabId
        );

    if (!input || !container) return;

    const query =
        input.value.trim();

    if (!query) return;

    container.innerHTML = `

        <div class="cv-title">
            Searching...
        </div>
    `;

    /*
       Use the existing Chox search API when available.
    */

    try {

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(
                    query + " site:youtube.com/watch"
                )
            );

        if (!response.ok) {

            throw new Error(
                "Search request failed"
            );

        }

        const data =
            await response.json();

        const results =
            data.results ||
            data.web ||
            [];

        renderChoxVideoResults(
            tabId,
            results
        );

    } catch (error) {

        console.error(
            "Chox Video search error:",
            error
        );

        container.innerHTML = `

            <div class="cv-title">
                Chox Video
            </div>

            <div class="cv-empty">
                Search is currently unavailable.
                <br><br>
                Make sure your Chox server/API is running.
            </div>
        `;
    }
}


/* =========================================================
   RENDER VIDEO RESULTS
========================================================= */

function renderChoxVideoResults(
    tabId,
    results
) {

    const container =
        document.getElementById(
            "cv-content-" + tabId
        );

    if (!container) return;

    if (
        !Array.isArray(results) ||
        results.length === 0
    ) {

        container.innerHTML = `

            <div class="cv-title">
                No videos found
            </div>

            <div class="cv-empty">
                Try a different search.
            </div>
        `;

        return;
    }


    const videoResults =
        results.filter(
            item =>
                item.url &&
                (
                    item.url.includes(
                        "youtube.com/watch"
                    ) ||
                    item.url.includes(
                        "youtu.be/"
                    )
                )
        );


    if (videoResults.length === 0) {

        container.innerHTML = `

            <div class="cv-title">
                No videos found
            </div>

            <div class="cv-empty">
                No YouTube videos were returned.
            </div>
        `;

        return;
    }


    container.innerHTML = `

        <div class="cv-title">
            Video Results
        </div>

        <div class="cv-grid">

            ${videoResults
                .map(
                    (item, index) => {

                        const videoId =
                            getYouTubeId(
                                item.url
                            );

                        const thumbnail =
                            videoId
                                ? "https://i.ytimg.com/vi/" +
                                  videoId +
                                  "/hqdefault.jpg"
                                : "";

                        return `

                            <div
                                class="cv-card"
                                onclick="cvWatchVideo(
                                    '${tabId}',
                                    '${escapeAttribute(item.url)}',
                                    '${escapeAttribute(item.title || "Video")}'
                                )"
                            >

                                ${
                                    thumbnail
                                    ? `
                                        <img
                                            class="cv-thumbnail"
                                            src="${thumbnail}"
                                            alt=""
                                        >
                                      `
                                    : `
                                        <div class="cv-thumbnail"></div>
                                      `
                                }

                                <div class="cv-card-body">

                                    <div class="cv-card-title">
                                        ${escapeHTML(
                                            item.title ||
                                            "Video"
                                        )}
                                    </div>

                                    <div class="cv-card-url">
                                        YouTube
                                    </div>

                                </div>

                            </div>
                        `;
                    }
                )
                .join("")}

        </div>
    `;
}


/* =========================================================
   WATCH VIDEO
========================================================= */

function cvWatchVideo(
    tabId,
    url,
    title
) {

    const container =
        document.getElementById(
            "cv-content-" + tabId
        );

    if (!container) return;

    const videoId =
        getYouTubeId(url);

    if (!videoId) {

        container.innerHTML = `

            <div class="cv-empty">
                This video could not be opened.
            </div>
        `;

        return;
    }


    container.innerHTML = `

        <div class="cv-player">

            <iframe
                src="https://www.youtube-nocookie.com/embed/${videoId}"
                title="${escapeAttribute(title)}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

            <div class="cv-player-title">
                ${escapeHTML(title)}
            </div>

            <div class="cv-player-buttons">

                <button
                    class="cv-action"
                    onclick="cvShowHome('${tabId}')">
                    ← Back
                </button>

                <button
                    class="cv-action"
                    onclick="cvSaveFavorite('${escapeAttribute(url)}', '${escapeAttribute(title)}')">
                    ⭐ Favorite
                </button>

            </div>

        </div>
    `;
}


/* =========================================================
   VIDEO ID
========================================================= */

function getYouTubeId(url) {

    try {

        const parsed =
            new URL(url);

        if (
            parsed.hostname.includes(
                "youtu.be"
            )
        ) {

            return parsed.pathname
                .replace("/", "")
                .split("/")[0];

        }

        if (
            parsed.hostname.includes(
                "youtube.com"
            )
        ) {

            return parsed.searchParams.get(
                "v"
            );

        }

    } catch {

        return null;

    }

    return null;
}


/* =========================================================
   FAVORITES
========================================================= */

function cvSaveFavorite(
    url,
    title
) {

    let favorites =
        JSON.parse(
            localStorage.getItem(
                "choxVideoFavorites"
            ) || "[]"
        );

    const exists =
        favorites.some(
            item =>
                item.url === url
        );

    if (!exists) {

        favorites.push({
            url: url,
            title: title
        });

        localStorage.setItem(
            "choxVideoFavorites",
            JSON.stringify(favorites)
        );

        alert(
            "⭐ Added to Favorites"
        );

    } else {

        alert(
            "⭐ Already in Favorites"
        );

    }
}


function cvShowFavorites(tabId) {

    const container =
        document.getElementById(
            "cv-content-" + tabId

    if (!container) return;

    const favorites =
        JSON.parse(
            localStorage.getItem(
                "choxVideoFavorites"
            ) || "[]"
        );

    if (favorites.length === 0) {

        container.innerHTML = `

            <div class="cv-title">
                Favorites
            </div>

            <div class="cv-empty">
                You don't have any favorites yet.
            </div>
        `;

        return;
    }


    container.innerHTML = `

        <div class="cv-title">
            Favorites
        </div>

        <div class="cv-grid">

            ${favorites
                .map(
                    item => {

                        const id =
                            getYouTubeId(
                                item.url
                            );

                        const thumbnail =
                            id
                            ? "https://i.ytimg.com/vi/" +
                              id +
                              "/hqdefault.jpg"
                            : "";

                        return `

                            <div
                                class="cv-card"
                                onclick="cvWatchVideo(
                                    '${tabId}',
                                    '${escapeAttribute(item.url)}',
                                    '${escapeAttribute(item.title)}'
                                )"
                            >

                                ${
                                    thumbnail
                                    ? `
                                        <img
                                            class="cv-thumbnail"
                                            src="${thumbnail}"
                                            alt=""
                                        >
                                      `
                                    : ""
                                }

                                <div class="cv-card-body">

                                    <div class="cv-card-title">
                                        ${escapeHTML(
                                            item.title
                                        )}
                                    </div>

                                </div>

                            </div>
                        `;
                    }
                )
                .join("")}

        </div>
    `;
}

/* =========================================================
   SEARCH BUTTON
========================================================= */

function cvSearchFocus(tabId) {

    const input =
        document.getElementById(
            "cv-search-" + tabId
        );

    if (input) {

        input.focus();

    }
}


/* =========================================================
   ADDRESS BAR
========================================================= */

function addressKey(event) {

    if (
        event.key === "Enter"
    ) {

        openAddress();

    }
}


function openAddress() {

    const input =
        document.getElementById(
            "addressBar"
        );

    const value =
        input.value.trim();

    if (!value) return;

    const tab =
        tabs.find(
            t => t.id === activeTabId
        );

    if (!tab) return;


    if (
        value === "chox://video"
    ) {

        openChoxVideoPage(
            tab.id
        );

        return;

    }


    if (
        value.startsWith(
            "https://"
        ) ||
        value.startsWith(
            "http://"
        )
    ) {

        navigateTab(
            tab,
            value,
            getDomainName(value)
        );

        return;

    }


    if (
        value.includes(".") &&
        !value.includes(" ")
    ) {

        navigateTab(
            tab,
            "https://" + value,
            value
        );

        return;

    }


    performSearch(
        tab.id,
        value
    );
}


/* =========================================================
   SEARCH
========================================================= */

function performSearch(
    tabId,
    query
) {

    const tab =
        tabs.find(
            t => t.id === tabId
        );

    if (!tab) return;

    navigateTab(
        tab,
        "results.html?q=" +
        encodeURIComponent(query),
        "Search - " + query
    );
}


/* =========================================================
   WEBSITE NAVIGATION
========================================================= */

function navigateTab(
    tab,
    url,
    title
) {

    tab.type = "site";

    tab.url = url;

    tab.title =
        title || url;

    const page =
        document.getElementById(
            "page-" + tab.id
        );

    if (!page) return;

    page.innerHTML = "";

    const iframe =
        document.createElement(
            "iframe"
        );

    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";

    iframe.src = url;

    page.appendChild(iframe);

    updateTabButton(tab);

    updateAddressBar();
}


/* =========================================================
   SWITCH TAB
========================================================= */

function switchTab(id) {

    const tab =
        tabs.find(
            t => t.id === id
        );

    if (!tab) return;

    activeTabId = id;

    document
        .querySelectorAll(".tab")
        .forEach(
            element => {

                element.classList.toggle(
                    "active",
                    element.dataset.id === id
                );

            }
        );

    document
        .querySelectorAll(".tab-page")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );

    const page =
        document.getElementById(
            "page-" + id
        );

    if (page) {

        page.classList.add(
            "active"
        );

    }

    updateAddressBar();
}


/* =========================================================
   TAB UPDATE
========================================================= */

function updateTabButton(tab) {

    const button =
        document.querySelector(
            `.tab[data-id="${tab.id}"]`
        );

    if (!button) return;

    const title =
        button.querySelector(
            ".tab-title"
        );

    if (title) {

        title.textContent =
            tab.title;

    }
}


/* =========================================================
   CLOSE TAB
========================================================= */

function closeTab(id) {

    const index =
        tabs.findIndex(
            t => t.id === id
        );

    if (index === -1) return;

    const wasActive =
        activeTabId === id;

    tabs.splice(
        index,
        1
    );

    const button =
        document.querySelector(
            `.tab[data-id="${id}"]`
        );

    if (button) {

        button.remove();

    }

    const page =
        document.getElementById(
            "page-" + id
        );

    if (page) {

        page.remove();

    }

    if (tabs.length === 0) {

        createNewTab();

        return;

    }

    if (wasActive) {

        switchTab(
            tabs[
                Math.max(
                    0,
                    index - 1
                )
            ].id
        );

    }
}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    const tab =
        tabs.find(
            t => t.id === activeTabId
        );

    if (!tab) return;

    tab.type = "home";

    tab.url = "";

    tab.title = "New Tab";

    renderHome(tab);

    updateTabButton(tab);

    updateAddressBar();
}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    if (window.history.length > 1) {

        window.history.back();

    }
}


/* =========================================================
   FORWARD
========================================================= */

function goForward() {

    window.history.forward();

}


/* =========================================================
   RELOAD
========================================================= */

function reloadPage() {

    const tab =
        tabs.find(
            t => t.id === activeTabId
        );

    if (!tab) return;

    if (
        tab.type === "home"
    ) {

        renderHome(tab);

        return;

    }

    if (
        tab.type === "chox-video"
    ) {

        openChoxVideoPage(
            tab.id
        );

        return;

    }

    const page =
        document.getElementById(
            "page-" + tab.id
        );

    if (!page) return;

    const iframe =
        page.querySelector(
            "iframe"
        );

    if (iframe) {

        iframe.src =
            iframe.src;

    }
}


/* =========================================================
   ADDRESS BAR
========================================================= */

function updateAddressBar() {

    const input =
        document.getElementById(
            "addressBar"
        );

    if (!input) return;

    const tab =
        tabs.find(
            t => t.id === activeTabId
        );

    if (!tab) return;

    input.value =
        tab.url || "";
}


/* =========================================================
   HELPERS
========================================================= */

function getDomainName(url) {

    try {

        return new URL(url)
            .hostname
            .replace(
                "www.",
                ""
            );

    } catch {

        return "Website";

    }
}


function escapeHTML(text) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function escapeAttribute(text) {

    return String(text)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            "\\r"
        );
}


/* =========================================================
   START
========================================================= */

createNewTab();

</script>
