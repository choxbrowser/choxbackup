<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chox Browser</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;height:100vh;overflow:hidden}
button,input{font:inherit}
.browser{height:100vh;display:flex;flex-direction:column}
.tabs{height:44px;background:#1b1b1b;display:flex;align-items:center;padding:5px 8px;gap:5px}
.tab{height:34px;min-width:150px;max-width:230px;background:#292929;border:0;border-radius:8px;color:#ddd;padding:0 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.tab.active{background:#3a3a3a;color:#fff}
.tab-close{margin-left:8px;color:#aaa}
.new-tab{width:34px;height:34px;border:0;border-radius:8px;background:#292929;color:#fff;font-size:22px;cursor:pointer}
.toolbar{height:52px;background:#222;display:flex;align-items:center;gap:7px;padding:7px 10px}
.tool{width:36px;height:36px;border:0;border-radius:8px;background:#333;color:#fff;cursor:pointer}
.address{flex:1;height:36px;border:0;border-radius:18px;background:#333;color:#fff;padding:0 16px;outline:none}
.pages{flex:1;position:relative}
.tab-page{position:absolute;inset:0;display:none;background:#111}
.tab-page.active{display:block}
.home{height:100%;overflow:auto;padding:55px 20px;text-align:center}
.logo{font-size:58px;font-weight:800;letter-spacing:-3px;margin-bottom:8px}
.subtitle{color:#aaa;margin-bottom:30px}
.search{width:min(680px,90%);height:50px;border:1px solid #444;border-radius:25px;background:#222;color:#fff;padding:0 20px;outline:none}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
.quick-link{border:1px solid #444;background:#222;color:#fff;border-radius:12px;padding:14px 20px;cursor:pointer}
.quick-link:hover{background:#333}
.video-app{height:100%;display:flex;flex-direction:column}
.video-top{height:58px;background:#191919;border-bottom:1px solid #333;display:flex;align-items:center;padding:0 15px;gap:10px}
.video-brand{font-size:21px;font-weight:800}
.video-search{flex:1;max-width:600px;margin:auto;height:38px;border-radius:20px;border:1px solid #444;background:#292929;color:#fff;padding:0 15px;outline:none}
.video-body{display:flex;flex:1;min-height:0}
.video-side{width:190px;background:#181818;border-right:1px solid #333;padding:12px}
.video-nav{width:100%;padding:12px;border:0;border-radius:9px;background:transparent;color:#ddd;text-align:left;cursor:pointer;margin-bottom:5px}
.video-nav:hover,.video-nav.active{background:#303030;color:#fff}
.video-main{flex:1;overflow:auto;padding:20px}
.video-title{font-size:25px;margin:0 0 18px}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.video-card{background:#1c1c1c;border:1px solid #333;border-radius:12px;overflow:hidden;cursor:pointer}
.video-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#292929}
.video-info{padding:11px}
.video-name{font-weight:700;line-height:1.3}
.video-url{font-size:12px;color:#999;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:#999;padding:30px;text-align:center}
.player-wrap{max-width:1000px;margin:auto}
.player{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.back{margin-bottom:15px;padding:10px 14px;border:0;border-radius:8px;background:#333;color:#fff;cursor:pointer}
@media(max-width:700px){
.video-side{width:70px}
.video-nav{font-size:0;text-align:center}
.video-nav:first-letter{font-size:18px}
.video-main{padding:12px}
}
</style>
</head>
<body>
<div class="browser">
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <button class="tool" onclick="goBack()">←</button>
    <button class="tool" onclick="goForward()">→</button>
    <button class="tool" onclick="reloadPage()">⟳</button>
    <input id="address" class="address" placeholder="Search or enter a URL" onkeydown="addressKey(event)">
    <button class="tool" onclick="openAddress()">↵</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<script>
let tabs=[];
let activeTabId=null;
let nextId=1;

function createNewTab(){
  const id=nextId++;
  tabs.push({id,type:"home",url:"chox://home",title:"New Tab"});
  const btn=document.createElement("button");
  btn.className="tab";
  btn.id="tab-"+id;
  btn.onclick=()=>switchTab(id);
  btn.innerHTML='<span class="tab-title">New Tab</span><span class="tab-close" onclick="closeTab(event,'+id+')">×</span>';
  document.getElementById("tabs").appendChild(btn);

  const page=document.createElement("div");
  page.className="tab-page";
  page.id="page-"+id;
  document.getElementById("pages").appendChild(page);

  renderHome(tabs[tabs.length-1]);
  switchTab(id);
}

function switchTab(id){
  activeTabId=id;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab-page").forEach(x=>x.classList.remove("active"));
  const tab=document.getElementById("tab-"+id);
  const page=document.getElementById("page-"+id);
  if(tab) tab.classList.add("active");
  if(page) page.classList.add("active");
  updateAddressBar();
}

function closeTab(event,id){
  event.stopPropagation();
  const index=tabs.findIndex(t=>t.id===id);
  if(index<0)return;
  document.getElementById("tab-"+id)?.remove();
  document.getElementById("page-"+id)?.remove();
  tabs.splice(index,1);
  if(!tabs.length){createNewTab();return}
  if(activeTabId===id){
    switchTab(tabs[Math.max(0,index-1)].id);
  }
}

function updateTabButton(tab){
  const el=document.querySelector("#tab-"+tab.id+" .tab-title");
  if(el)el.textContent=tab.title;
}

function updateAddressBar(){
  const tab=tabs.find(t=>t.id===activeTabId);
  document.getElementById("address").value=tab?.url||"";
}

function renderHome(tab){
  const page=document.getElementById("page-"+tab.id);
  page.innerHTML=`
    <div class="home">
      <div class="logo">Chox</div>
      <div class="subtitle">A simple, fast browser</div>
      <input class="search" placeholder="Search with Chox" onkeydown="homeSearch(event)">
      <div class="quick">
        <button class="quick-link" onclick="openChoxVideoPage(${tab.id})">▶ Chox Video</button>
        <button class="quick-link" onclick="searchWeb(${tab.id})">🔎 Search</button>
        <button class="quick-link" onclick="openSite(${tab.id},'https://www.google.com')">🌐 Google</button>
      </div>
    </div>`;
}

function homeSearch(event){
  if(event.key!=="Enter")return;
  const q=event.target.value.trim();
  if(q) searchWeb(activeTabId,q);
}

function searchWeb(id,q){
  if(!q)q="Chox";
  const tab=tabs.find(t=>t.id===id);
  if(!tab)return;
  tab.type="web";
  tab.url="https://www.google.com/search?q="+encodeURIComponent(q);
  tab.title="Search";
  const page=document.getElementById("page-"+id);
  page.innerHTML='<iframe src="'+tab.url+'" style="width:100%;height:100%;border:0"></iframe>';
  updateTabButton(tab);
  switchTab(id);
}

function openSite(id,url){
  const tab=tabs.find(t=>t.id===id);
  if(!tab)return;
  tab.type="web";
  tab.url=url;
  tab.title=url.replace(/^https?:\\/\\//,"").split("/")[0];
  const page=document.getElementById("page-"+id);
  page.innerHTML='<iframe src="'+url+'" style="width:100%;height:100%;border:0"></iframe>';
  updateTabButton(tab);
  switchTab(id);
}

/* FIXED: this function now switches to the tab after opening Chox Video. */
function openChoxVideoPage(id){
  const tab=tabs.find(t=>t.id===id);
  if(!tab)return;

  tab.type="chox-video";
  tab.url="chox://video";
  tab.title="Chox Video";

  const page=document.getElementById("page-"+id);
  page.innerHTML=choxVideoHTML();

  updateTabButton(tab);
  switchTab(id); // THIS IS THE IMPORTANT FIX
  cvHome(id);
}

function choxVideoHTML(){
  return `
  <div class="video-app">
    <div class="video-top">
      <div class="video-brand">▶ Chox Video</div>
      <input id="cv-search" class="video-search" placeholder="Search videos..." onkeydown="cvSearchKey(event)">
    </div>
    <div class="video-body">
      <aside class="video-side">
        <button class="video-nav active" onclick="cvHome(activeTabId)">🏠 Home</button>
        <button class="video-nav" onclick="cvSearchPrompt()">🔎 Search</button>
        <button class="video-nav" onclick="cvShow('history')">🕘 History</button>
        <button class="video-nav" onclick="cvShow('favorites')">⭐ Favorites</button>
      </aside>
      <main class="video-main" id="cv-main"></main>
    </div>
  </div>`;
}

function getState(){
  try{return JSON.parse(localStorage.getItem("choxVideoState")||'{"history":[],"favorites":[]}')}
  catch(e){return {history:[],favorites:[]}}
}
function saveState(s){localStorage.setItem("choxVideoState",JSON.stringify(s))}

function cvHome(id){
  if(id!==activeTabId)switchTab(id);
  const main=document.getElementById("cv-main");
  if(!main)return;
  main.innerHTML=`
    <h1 class="video-title">Chox Video</h1>
    <p style="color:#999">Search for videos using the box above.</p>
    <div class="video-grid">
      <div class="empty" style="grid-column:1/-1">
        Enter a search above to find YouTube videos.
      </div>
    </div>`;
}

function cvSearchKey(event){
  if(event.key==="Enter")cvSearch(event.target.value.trim());
}

function cvSearchPrompt(){
  const input=document.getElementById("cv-search");
  if(input){input.focus();return}
}

function cvSearch(q){
  if(!q)return;
  const main=document.getElementById("cv-main");
  main.innerHTML='<h1 class="video-title">Searching...</h1>';
  // Uses YouTube's normal search page through a supported browser navigation.
  // It does not bypass network restrictions.
  const tab=tabs.find(t=>t.id===activeTabId);
  if(!tab)return;
  tab.type="web";
  tab.url="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
  tab.title="YouTube Search";
  document.getElementById("page-"+tab.id).innerHTML=
    '<iframe src="'+tab.url+'" style="width:100%;height:100%;border:0"></iframe>';
  updateTabButton(tab);
  switchTab(tab.id);
}

function cvShow(type){
  const state=getState();
  const main=document.getElementById("cv-main");
  const list=state[type]||[];
  main.innerHTML='<h1 class="video-title">'+(type==="history"?"History":"Favorites")+'</h1>';
  if(!list.length){
    main.innerHTML+='<div class="empty">Nothing here yet.</div>';
    return;
  }
  const grid=document.createElement("div");
  grid.className="video-grid";
  list.forEach(v=>grid.appendChild(videoCard(v)));
  main.appendChild(grid);
}

function videoCard(v){
  const card=document.createElement("div");
  card.className="video-card";
  card.onclick=()=>cvWatch(v.id,v.title);
  const thumb=v.id?"https://i.ytimg.com/vi/"+v.id+"/hqdefault.jpg":"";
  card.innerHTML=
    '<img class="video-thumb" src="'+thumb+'" onerror="this.style.display=\'none\'">'+
    '<div class="video-info"><div class="video-name">'+escapeHTML(v.title||"Video")+
    '</div><div class="video-url">YouTube</div></div>';
  return card;
}

function cvWatch(id,title){
  if(!id)return;
  const state=getState();
  state.history=state.history.filter(v=>v.id!==id);
  state.history.unshift({id,title:title||"Video"});
  state.history=state.history.slice(0,50);
  saveState(state);

  const tab=tabs.find(t=>t.id===activeTabId);
  const page=document.getElementById("page-"+tab.id);
  page.innerHTML=`
    <div class="video-main" style="height:100%;overflow:auto">
      <div class="player-wrap">
        <button class="back" onclick="openChoxVideoPage(${tab.id})">← Back to Chox Video</button>
        <iframe class="player"
          src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
        <h2>${escapeHTML(title||"Video")}</h2>
        <button class="back" onclick="cvFavorite('${escapeJS(id)}','${escapeJS(title||"Video")}')">⭐ Add to Favorites</button>
      </div>
    </div>`;
  updateTabButton(tab);
  switchTab(tab.id);
}

function cvFavorite(id,title){
  const state=getState();
  if(!state.favorites.some(v=>v.id===id)){
    state.favorites.unshift({id,title});
    state.favorites=state.favorites.slice(0,50);
    saveState(state);
  }
  alert("Added to Favorites!");
}

function getYouTubeId(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes("youtu.be"))return u.pathname.slice(1);
    if(u.hostname.includes("youtube.com"))return u.searchParams.get("v");
  }catch(e){}
  return null;
}

function addressKey(event){
  if(event.key==="Enter")openAddress();
}

function openAddress(){
  const input=document.getElementById("address");
  let value=input.value.trim();
  if(!value)return;
  const tab=tabs.find(t=>t.id===activeTabId);
  if(!tab)return;

  if(value==="chox://video"){
    openChoxVideoPage(tab.id);
    return;
  }
  if(value==="chox://home"){
    tab.type="home";tab.url="chox://home";tab.title="New Tab";
    renderHome(tab);updateTabButton(tab);switchTab(tab.id);return;
  }

  let url=value;
  if(!/^https?:\\/\\//i.test(url)){
    url="https://www.google.com/search?q="+encodeURIComponent(value);
  }
  openSite(tab.id,url);
}

function reloadPage(){
  const tab=tabs.find(t=>t.id===activeTabId);
  if(!tab)return;
  if(tab.type==="chox-video")openChoxVideoPage(tab.id);
  else if(tab.type==="home")renderHome(tab);
  else openSite(tab.id,tab.url);
}

function goBack(){
  try{
    const page=document.getElementById("page-"+activeTabId);
    page.querySelector("iframe")?.contentWindow.history.back();
  }catch(e){}
}

function goForward(){
  try{
    const page=document.getElementById("page-"+activeTabId);
    page.querySelector("iframe")?.contentWindow.history.forward();
  }catch(e){}
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeJS(s){
  return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

createNewTab();
</script>
</body>
</html>
