<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chox Search</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="results-header">

    <a href="index.html" class="results-logo">
        <span class="logo-mark">C</span>
        Chox
    </a>

    <form id="resultsSearchForm" class="small-search">

        <input
            id="resultsSearchInput"
            type="text"
            autocomplete="off"
            placeholder="Search Chox..."
            required
        >

        <button type="submit">Search</button>

    </form>

</header>


<main class="results-container">

    <div id="searchInfo"></div>

    <div id="results">

        <div class="loading">
            Searching Chox...
        </div>

    </div>

</main>


<script>

const params = new URLSearchParams(window.location.search);
const query = params.get("q") || "";

const input = document.getElementById("resultsSearchInput");
const results = document.getElementById("results");
const searchInfo = document.getElementById("searchInfo");

input.value = query;

async function searchChox() {

    if (!query.trim()) {
        results.innerHTML = `
            <div class="empty">
                Enter something to search for.
            </div>
        `;
        return;
    }

    searchInfo.innerHTML = `
        <div class="result-title">
            Results for <strong>${escapeHTML(query)}</strong>
        </div>
    `;

    try {

        const apiURL =
            "https://api.duckduckgo.com/" +
            "?q=" + encodeURIComponent(query) +
            "&format=json" +
            "&no_html=1" +
            "&skip_disambig=0";

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error("Search request failed");
        }

        const data = await response.json();

        displayResults(data);

    } catch (error) {

        console.error(error);

        results.innerHTML = `
            <div class="error-card">
                <h2>Chox couldn't load the search</h2>

                <p>
                    Try searching again or use DuckDuckGo directly.
                </p>

                <a
                    class="external-search"
                    href="https://duckduckgo.com/?q=${encodeURIComponent(query)}&kp=1"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Search DuckDuckGo
                </a>
            </div>
        `;
    }
}


function displayResults(data) {

    let items = [];

    /*
     * DuckDuckGo Instant Answers can return
     * a main abstract plus RelatedTopics.
     */

    if (data.AbstractText && data.AbstractURL) {

        items.push({
            title: data.Heading || query,
            description: data.AbstractText,
            url: data.AbstractURL
        });

    }


    if (Array.isArray(data.RelatedTopics)) {

        for (const item of data.RelatedTopics) {

            if (
                item &&
                item.Text &&
                item.FirstURL
            ) {

                items.push({
                    title: getTitle(item.Text),
                    description: item.Text,
                    url: item.FirstURL
                });

            }

            /*
             * Some DuckDuckGo responses use
             * nested topic groups.
             */

            if (Array.isArray(item.Topics)) {

                for (const topic of item.Topics) {

                    if (
                        topic &&
                        topic.Text &&
                        topic.FirstURL
                    ) {

                        items.push({
                            title: getTitle(topic.Text),
                            description: topic.Text,
                            url: topic.FirstURL
                        });

                    }

                }

            }

        }

    }


    /*
     * Remove duplicates.
     */

    const unique = [];

    const seen = new Set();

    for (const item of items) {

        if (!seen.has(item.url)) {

            seen.add(item.url);
            unique.push(item);

        }

    }


    if (unique.length === 0) {

        results.innerHTML = `
            <div class="no-results">

                <h2>No Chox instant results</h2>

                <p>
                    DuckDuckGo didn't return an Instant Answer
                    for this search.
                </p>

                <a
                    class="external-search"
                    href="https://duckduckgo.com/?q=${encodeURIComponent(query)}&kp=1"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Continue searching
                </a>

            </div>
        `;

        return;
    }


    results.innerHTML = "";

    unique.slice(0, 20).forEach(item => {

        const card = document.createElement("article");

        card.className = "result-card";

        const domain = getDomain(item.url);

        card.innerHTML = `

            <div class="result-domain">
                ${escapeHTML(domain)}
            </div>

            <a
                class="result-link"
                href="${escapeAttribute(item.url)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ${escapeHTML(item.title)}
            </a>

            <p>
                ${escapeHTML(item.description)}
            </p>

        `;

        results.appendChild(card);

    });

}


function getTitle(text) {

    const separator = " - ";

    if (text.includes(separator)) {

        return text.split(separator)[0];

    }

    return text.substring(0, 100);

}


function getDomain(url) {

    try {

        return new URL(url).hostname;

    } catch {

        return "";

    }

}


function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(text) {

    return String(text)
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");

}


document
    .getElementById("resultsSearchForm")
    .addEventListener("submit", event => {

        event.preventDefault();

        const newQuery =
            document
                .getElementById("resultsSearchInput")
                .value
                .trim();

        if (!newQuery) return;

        window.location.href =
            "results.html?q=" +
            encodeURIComponent(newQuery);

    });


searchChox();

</script>

</body>
</html>
